name: Build Starfall Dreams

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build remapped mod JAR
        run: gradle --no-daemon clean build

      - name: Upload JAR as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: StarfallDreams-1.21.11
          path: build/libs/starfall-dreams-1.0.0.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest JAR as a GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view starfall-latest >/dev/null 2>&1 || gh release create starfall-latest --title "Starfall Dreams — latest build" --notes "Automatically built from the latest main branch commit." --prerelease
          gh release upload starfall-latest build/libs/starfall-dreams-1.0.0.jar --clobber
