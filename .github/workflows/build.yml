name: Build Vasya mod

on:
  push:
    branches:
      - feature/vasya-cat
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vasya-mod-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Build mod (retry transient repository errors)
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3; do
            echo "Build attempt ${attempt}/3"
            gradle --no-daemon clean build
            result=$?
            if [ "$result" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting before retry in case Maven Central is rate-limiting requests."
              sleep $((attempt * 30))
            fi
          done
          exit "$result"

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: vasya-learning-cat-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
