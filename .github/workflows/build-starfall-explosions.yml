name: Build Starfall Explosions

on:
  push:
    branches:
      - feature/starfall-explosions-fabric
    paths:
      - "minecraft/starfall-explosions/**"
      - ".github/workflows/build-starfall-explosions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.1"

      - name: Build Fabric mod
        working-directory: minecraft/starfall-explosions
        run: gradle --no-daemon clean build

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: starfall-explosions-fabric-mc-1.21.11
          path: minecraft/starfall-explosions/build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
